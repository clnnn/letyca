<span class="tui-text_h3 title">{{ title }}</span>
<tui-combo-box
  class="dropdown"
  [class.tui-skeleton]="store.connectionsLoading() === 'LOADING'"
  [class.tui-skeleton_rounded]="true"
  [formControl]="connectionDropdown"
  [stringify]="stringify"
  (ngModelChange)="onChanges($event)"
>
  Selected connection:
  <tui-data-list-wrapper
    *tuiDataList
    [items]="store.connections()"
    [itemContent]="stringify | tuiStringifyContent"
  >
  </tui-data-list-wrapper>
</tui-combo-box>
