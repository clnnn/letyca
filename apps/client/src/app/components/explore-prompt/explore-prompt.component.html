<div class="message-container">
  <tui-textarea
    class="tui-space_bottom-4 field-large"
    [ngModel]="store.userRequest()"
    (ngModelChange)="store.setUserRequest($event)"
    [disabled]="this.store.selectedConnectionId() === null"
  >
    What do you want to display?
  </tui-textarea>
  <button
    tuiIconButton
    iconEnd="search"
    type="submit"
    class="tui-space_right-3 tui-space_bottom-3 send-button"
    [disabled]="
      store.userRequest().length === 0 ||
      this.store.selectedConnectionId() === null
    "
    routerLink="/explore/charts"
    [queryParams]="{
      c: this.store.selectedConnectionId(),
      q: store.userRequest()
    }"
  ></button>
</div>

<section
  class="suggestions-container"
  tuiCardLarge
  tuiSurface="flat"
  [style]="{ opacity: this.store.selectedConnectionId() === null ? 0 : 1 }"
  [tuiSkeleton]="store.suggestionsLoading() === 'LOADING'"
>
  <h2 tuiHeader>
    <span tuiTitle>Suggestions</span>
  </h2>
  <div class="list">
    @for (suggestion of store.suggestions(); track $index) {
      <button tuiChip (click)="suggestionClick(suggestion)">
        {{ suggestion }}
      </button>
    }
  </div>
</section>
