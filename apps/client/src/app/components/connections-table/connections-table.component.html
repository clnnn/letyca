<table tuiTable [size]="size" [style.width.rem]="58">
  <thead>
    <tr>
      <th tuiTh>Connection</th>
      <th tuiTh>Database</th>
      <th tuiTh>Schema</th>
      <th tuiTh>Actions</th>
    </tr>
  </thead>
  <tbody tuiTbody>
    <tr *ngFor="let conn of connections">
      <td tuiTd>
        <div [tuiCell]="size">
          <span tuiTitle>
            {{ conn.host }}
            <span tuiSubtitle>{{ conn.port }}</span>
          </span>
        </div>
      </td>
      <td tuiTd>
        <div [tuiCell]="size">
          <span tuiTitle>
            <span tuiStatus>
              <tui-icon icon="database" />
              {{ conn.database }}
            </span>
          </span>
        </div>
      </td>
      <td tuiTd>
        <div [tuiCell]="size">
          <span tuiTitle>
            {{ conn.schema }}
          </span>
        </div>
      </td>
      <td tuiTd>
        <span tuiStatus>
          <button
            appearance="link"
            iconStart="@tui.pencil"
            size="xs"
            tuiIconButton
          >
            Edit
          </button>
          <button
            appearance="link"
            iconStart="@tui.ellipsis"
            size="xs"
            tuiIconButton
          >
            More
          </button>
        </span>
      </td>
    </tr>
  </tbody>
</table>
