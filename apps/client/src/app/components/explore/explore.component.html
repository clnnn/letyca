<le-explore-header
  title="Explore"
  [connections]="store.connections()"
  [connectionsLoading]="store.connectionsLoading()"
  (connectionChange)="selectConnection($event.id)"
/>
<le-explore-prompt
  [connectionSelected]="store.selectedConnectionId() !== null"
  [chartLoading]="chartLoading"
  [suggestions]="store.suggestions()"
  [suggestionsLoading]="store.suggestionsLoading()"
/>
