@switch (store.previewChartLoading()) {
  @case ('INIT') {
    <h1>No charts loaded</h1>
  }
  @case ('ERROR') {
    <le-chart-generation-error class="content" />
  }
  @case ('LOADING') {
    <le-chart-generation-loading
      [userRequest]="store.userRequest()"
      class="content"
    />
  }
  @case ('LOADED') {
    <le-chart class="content" />
  }
}
