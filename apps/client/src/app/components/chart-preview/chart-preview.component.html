<span class="tui-text_h3 title">{{ typeWrittenUserRequest$ | async }}</span>

@switch (store.previewChartLoading()) {
  @case ('ERROR') {
    <le-chart-generation-error class="content" />
  }
  @case ('LOADING') {
    <le-chart-generation-loading class="content" />
  }
  @case ('LOADED') {
    <le-chart class="content" />
  }
}
